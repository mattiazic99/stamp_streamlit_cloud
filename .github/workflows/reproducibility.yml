name: Manuscript reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-fresh-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-reproduction.lock.txt
      - run: python -m pip install -r requirements-reproduction.lock.txt
      - run: python -m pip install pytest==9.0.2
      - run: python -m pytest statistical_validation_cli/tests tests -q
      - run: python -m statistical_validation_cli.paper check-reference
      - run: python -m statistical_validation_cli.paper replay --demo

  interface-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --wait
      - run: docker compose exec -T stamp python -m pip check
      - run: docker compose exec -T stamp python - < scripts/check_interface_container.py
      - if: always()
        run: docker compose logs --tail 100 stamp
      - if: always()
        run: docker compose down
