[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stamp"
version = "1.0.0"
description = "STAMP — Spatio-Temporal Analysis and Mapping of gene-expression Patterns"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["gene expression", "aging", "transcriptomics", "GTEx", "switching genes"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
# The Streamlit interface.
app = ["streamlit>=1.30", "plotly>=5.18"]
# The offline ingestion and pipeline scripts in scripts/.
pipeline = ["tqdm>=4.65", "cassandra-driver>=3.28"]
# The exploratory SMOTE stage; install in an isolated environment.
validation = ["imbalanced-learn==0.14.2"]
dev = ["pytest>=7.4", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["stamp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
